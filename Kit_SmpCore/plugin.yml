name: Kit_SmpCore
version: '1.0.0'
main: com.Kit_SmpCore.plugin.MainClass
api-version: '1.21'
description: Cosmic-themed kit system for SMP servers
author: Kit_SmpCore
website: https://example.com

commands:
  kit:
    description: Apri il menu dei kit o richiedi un kit specifico
    usage: |
      /kit - Apri il menu principale
      /kit <id> - Richiedi un kit specifico
      /kit preview <id> - Anteprima di un kit
      /kit give <player> <id> - Dai un kit a un giocatore (admin)
      /kit reset <player> <id|all> - Resetta i cooldown di un giocatore
      /kit reload - Ricarica la configurazione
    aliases: [kits, smpkit]

permissions:
  kit.use:
    description: Permette di usare il comando /kit
    default: true
  kit.stella_nascente:
    description: Accesso al kit Stella Nascente
    default: true
  kit.stella:
    description: Accesso al kit Stella
    default: false
  kit.supernova:
    description: Accesso al kit Supernova
    default: false
  kit.quasar:
    description: Accesso al kit Quasar
    default: false
  kit.buco_nero:
    description: Accesso al kit Buco Nero
    default: false
  kit.cooldown.vip:
    description: Riduzione cooldown del 25%
    default: false
  kit.cooldown.mvp:
    description: Riduzione cooldown del 50%
    default: false
  kit.cooldown.bypass:
    description: Nessun cooldown per i kit
    default: op
  kit.admin:
    description: Comandi amministrativi per i kit
    default: op