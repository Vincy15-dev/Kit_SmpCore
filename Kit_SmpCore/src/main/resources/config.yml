# Kit_SmpCore - Configuration
# Cosmic-themed kit system for SMP servers

# Storage settings
storage:
  player-data-folder: "playerdata"
  auto-save-interval: 5
  save-on-disable: true

# First join kit (given automatically once)
first-join-kit: "stella_nascente"

# Cooldown reduction by permission (highest match wins, capped at 90%)
cooldown-reduction:
  kit.cooldown.vip: 25
  kit.cooldown.mvp: 50

# GUI Settings
gui:
  main-title: "&5&lCOSMOS &7&lKIT"
  preview-title: "&5&l{KIT} &7&lANTEPRIMA"
  kit-slots: [20, 21, 22, 23, 24]
  info-slot: 4
  close-slot: 49
  back-slot: 48
  claim-slot: 50
  star-slots: [0, 1, 2, 6, 7, 8, 45, 46, 47, 51, 52, 53]
  frame-slots: [0, 1, 2, 3, 5, 6, 7, 8, 9, 17, 18, 26, 27, 35, 36, 44, 45, 53]
  icons:
    available: "NETHER_STAR"
    cooldown: "CLOCK"
    locked: "BARRIER"
    claimed: "LIGHT_GRAY_DYE"
  twinkle:
    color1: "#7C3AED"
    color2: "#22D3EE"
    interval-ticks: 10

# Sounds (Registry.SOUNDS keys)
sounds:
  open-gui: "UI_BUTTON_CLICK"
  close-gui: "UI_BUTTON_CLICK"
  claim-success: "ENTITY_PLAYER_LEVELUP"
  claim-error: "ENTITY_VILLAGER_NO"
  navigate: "UI_BUTTON_CLICK"
  buco-nero-claim: "ENTITY_ENDER_DRAGON_GROWL"
  twinkle: "BLOCK_NOTE_BLOCK_CHIME"

# Particles for claim feedback
particles:
  enabled: true
  buco-nero: "PORTAL"
  default: "FIREWORK"

# Drop items at feet if inventory full
drop-at-feet: false

# Allow enchant levels above vanilla max
allow-unsafe-enchants: false

# Debug mode
debug: false
